[package]
name = "sentinel"
version = "0.1.0"
edition = "2024"
description = "Local-first Linux server intelligence and observability"
license = "MIT"
default-run = "sentinel"

[dependencies]
argon2 = { version = "0.6", features = ["password-hash", "rand_core"] }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8.9", features = ["json", "macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
if-addrs = "0.13"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1.54", features = ["full"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
